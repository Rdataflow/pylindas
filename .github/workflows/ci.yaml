name: 🧊 CI tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: 🧊 CI test
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-26.04', 'macos-26', 'windows-2025' ]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: install requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: test
      env:
        PYTHONWARNINGS: default
        PYTHONUTF8: 1
      run: |
        pytest -s -vv tests example/Cubes/Biotope_Statistik/biotope.py example/Cubes/concept_table_airport/airport.py example/Cubes/mock/mock.py example/Shared_Dimensions/shared_dimension_generation/sd_example.py

  test-latest-deps:
    name: 🧊 CI test (latest deps)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.x
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: install requirements
      run: |
        python -m pip install --upgrade pip
        sed -i -E 's/==.*$//' requirements.txt
        sed -i -E 's/==.*$//' requirements-dev.txt
        pip install -r requirements-dev.txt
    - name: test
      env:
        PYTHONUTF8: 1
      run: pytest -q tests example/Cubes/Biotope_Statistik/biotope.py example/Cubes/concept_table_airport/airport.py example/Cubes/mock/mock.py example/Shared_Dimensions/shared_dimension_generation/sd_example.py

  lint:
    name: 🧹 Ruff lint
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
